name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev,mcp,eval]"
      - name: Lint
        run: ruff check src tests scripts bench
      - name: Format
        run: ruff format --check .
      - name: Types (strict, core package)
        run: mypy
      - name: Tests
        run: pytest --cov --cov-report=term -m "not slow"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: python -m pip install -e .
      - name: Dependency vulnerability scan (S-12)
        run: pip-audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build image (hash-pinned dependencies)
        run: docker build -t sheetguard:ci .
      - name: Image runs as non-root
        run: test "$(docker run --rm --entrypoint id sheetguard:ci -u)" = "10001"
      - name: Hardened MCP smoke test (read-only rootfs, no caps, no network, ro data)
        run: |
          python -m pip install "mcp>=2.3,<3" anyio
          python scripts/smoke_mcp.py -- docker run -i --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges --network none --memory 2g --pids-limit 64 \
            -v "$PWD/tests/fixtures:/data:ro" sheetguard:ci

  sandbox:
    # Same guarantees without Docker: unprivileged uid, no network namespace, ro data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[mcp,eval]"
      - run: |
          cp -r tests/fixtures /tmp/ro_data && chmod -R a-w /tmp/ro_data
          python scripts/smoke_mcp.py -- sudo unshare --net setpriv --reuid=65534 \
            --regid=65534 --clear-groups --inh-caps=-all --no-new-privs \
            "$(which python)" -B -m sheetguard.mcp.server --root /tmp/ro_data

  benchmark:
    # The benchmark is a deliverable: it must keep running and its table must not drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[eval]"
      - run: python bench/run_bench.py > /dev/null
      - name: Results match the committed table (environment line excluded)
        shell: bash
        run: |
          diff <(tail -n +4 bench/results/results.md | grep -v "Runtime\|median") \
               <(git show HEAD:bench/results/results.md | tail -n +4 | grep -v "Runtime\|median")
