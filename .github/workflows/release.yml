name: Release

# Push a tag like v0.1.0 to publish. One-time setup:
#  - PyPI: add a "trusted publisher" for this repo and workflow (pypi.org -> project ->
#    Publishing), environment name "pypi". No API token is stored anywhere.
#  - GHCR: nothing to configure; the image goes to ghcr.io/<owner>/sheetguard.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches package version
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$VERSION" = "${GITHUB_REF_NAME}"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel in a clean venv and smoke-test it
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install "$(ls dist/*.whl)[mcp,eval]" anyio
          /tmp/v/bin/sheetguard --version
          /tmp/v/bin/sheetguard audit tests/fixtures/reference/dcf.xlsx
          /tmp/v/bin/python scripts/smoke_mcp.py -- /tmp/v/bin/sheetguard-mcp --root tests/fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke-test hardened, push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sheetguard
          docker build -t $IMAGE:${GITHUB_REF_NAME#v} -t $IMAGE:latest .
          python3 -m pip install "mcp>=2.3,<3" anyio
          python3 scripts/smoke_mcp.py -- docker run -i --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges --network none \
            -v "$PWD/tests/fixtures:/data:ro" $IMAGE:${GITHUB_REF_NAME#v}
          docker push --all-tags $IMAGE

  github-release:
    needs: [pypi, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk "/^## \[${GITHUB_REF_NAME#v}\]/{f=1;next}/^## \[/{f=0}f" CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "SheetGuard $GITHUB_REF_NAME" \
            --notes-file notes.md
