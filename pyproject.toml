[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sheetguard"
version = "0.1.0"
description = "A secure, read-only MCP server that lets AI agents audit Excel models and flags prompt injection hidden in spreadsheets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Dachi Beridze" }]
keywords = ["excel", "mcp", "audit", "prompt-injection", "financial-models", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
  "Typing :: Typed",
]
dependencies = [
  "openpyxl>=3.1.2,<3.2",
  "defusedxml>=0.7.1",
  "pydantic>=2.6,<3",
  "typer>=0.12",
  "jinja2>=3.1",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
eval = ["formulas>=1.2.8"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff==0.16.9",  # pinned: formatter output differs between versions
  "mypy==2.3.1",
  "pre-commit>=3.7",
]

[project.scripts]
sheetguard = "sheetguard.cli:app"
sheetguard-mcp = "sheetguard.mcp.server:main"

[project.urls]
Homepage = "https://github.com/dachib04/sheetguard"
Documentation = "https://github.com/dachib04/sheetguard/tree/main/docs"
Issues = "https://github.com/dachib04/sheetguard/issues"
Changelog = "https://github.com/dachib04/sheetguard/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sheetguard"]

[tool.hatch.build.targets.sdist]
exclude = ["bench/corpus", "docs/demo.gif", "examples/sample_reports", ".github"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "PT018", "PT011", "E501", "N802"]
"src/sheetguard/security/injection.py" = ["RUF001"]  # the confusables table is the point
"tests/unit/test_injection.py" = ["RUF001"]
"bench/**" = ["S", "T201"]
"scripts/**" = ["S", "T201"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["sheetguard"]
strict = true
warn_unreachable = true
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "defusedxml.*", "formulas.*"]
ignore_missing_imports = true

# Optional evaluator internals: numpy's stubs use 3.12-only syntax, schedula is untyped.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "schedula", "schedula.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: performance tests (deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["sheetguard"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
